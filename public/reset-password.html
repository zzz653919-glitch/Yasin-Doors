<!doctype html>
<html lang="ru" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Смена пароля — YasinDoors</title>
  <meta name="description" content="Задайте новый пароль для аккаунта YasinDoors.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f7f5f1">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/account.css">
  <link rel="stylesheet" href="/assets/css/mobile.css" media="(max-width: 960px)">
  <link rel="stylesheet" href="/assets/css/loader.css">
  <script src="/assets/js/theme-init.js"></script>
  <script src="/assets/js/loader.js"></script>
</head>
<body data-page="reset">
  <div data-include="header"></div>

  <main>
    <section class="auth-page">
      <div class="container">
        <div class="auth-wrap">
          <div class="card auth-card">
            <div class="auth-head">
              <span class="eyebrow">Новый пароль</span>
              <h1>Смена пароля</h1>
              <p>Придумайте новый пароль для вашего аккаунта.</p>
            </div>
            <form class="auth-form" data-auth-form="reset" novalidate>
        <div class="field">
          <label for="password">Новый пароль</label>
          <div class="pw-wrap">
            <input class="input" id="password" name="password" type="password" autocomplete="new-password" maxlength="128" placeholder="••••••••" required>
            <button class="pw-toggle" type="button" data-pw-toggle aria-pressed="false" aria-label="Показать пароль"><svg class="icon" aria-hidden="true"><use href="#i-eye"></use></svg><span>Показать пароль</span></button>
          </div>
        </div>
        <div class="pw-meter" data-pw-meter data-score="0" aria-live="polite">
          <div class="pw-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          <div class="pw-meter-label" data-pw-label></div>
          <ul class="pw-rules"><li data-rule="len">8+ символов</li><li data-rule="letter">Буквы</li><li data-rule="digit">Цифры</li></ul>
        </div>
        <div class="field">
          <label for="password2">Подтвердите пароль</label>
          <div class="pw-wrap">
            <input class="input" id="password2" name="password2" type="password" autocomplete="new-password" maxlength="128" placeholder="••••••••" required>
            <button class="pw-toggle" type="button" data-pw-toggle aria-pressed="false" aria-label="Показать пароль"><svg class="icon" aria-hidden="true"><use href="#i-eye"></use></svg><span>Показать пароль</span></button>
          </div>
        </div>
        <div class="form-alert" aria-live="polite"></div>
        <button class="btn btn--gold btn--block" type="submit">Сохранить пароль</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div data-include="footer"></div>

  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/products.js"></script>
  <script src="/assets/js/app.js"></script>
  <script src="/assets/js/account.js"></script>
  <script src="/assets/js/scroll.js"></script>
  <script src="/assets/js/form-utils.js"></script>
  <script src="/assets/js/auth-ui.js"></script>
  <script src="/assets/js/pages/auth.js"></script>
</body>
</html>
