<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
<!-- Bosh sahifa video-banneri uchun poster: qorong‘i premium interyer, markazda Noir Gold MDF eshik -->
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#121213"/><stop offset=".55" stop-color="#232220"/><stop offset="1" stop-color="#161615"/>
</linearGradient>
<radialGradient id="spot" cx=".675" cy=".08" r=".6">
<stop offset="0" stop-color="#f3dcb4" stop-opacity=".42"/><stop offset=".45" stop-color="#c9a66b" stop-opacity=".12"/><stop offset="1" stop-color="#c9a66b" stop-opacity="0"/>
</radialGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#1f1b18"/><stop offset="1" stop-color="#0c0b0a"/>
</linearGradient>
<linearGradient id="slat" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#2b2926"/><stop offset=".5" stop-color="#34312d"/><stop offset="1" stop-color="#262421"/>
</linearGradient>
<linearGradient id="leaf" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#1b1b1d"/><stop offset=".45" stop-color="#2d2d2e"/><stop offset="1" stop-color="#1a1a1b"/>
</linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".12"/>
</linearGradient>
<linearGradient id="casing" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#151517"/><stop offset=".5" stop-color="#2a2a2c"/><stop offset="1" stop-color="#141415"/>
</linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#f0dcb8"/><stop offset=".5" stop-color="#d1ac6a"/><stop offset="1" stop-color="#887045"/>
</linearGradient>
<linearGradient id="led" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#e9cf9f" stop-opacity="0"/><stop offset=".5" stop-color="#e9cf9f"/><stop offset="1" stop-color="#e9cf9f" stop-opacity="0"/>
</linearGradient>
<linearGradient id="refl" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#c9a66b" stop-opacity=".22"/><stop offset="1" stop-color="#c9a66b" stop-opacity="0"/>
</linearGradient>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="glow" x="-200%" y="-20%" width="500%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#wall)"/>
<!-- vertikal devor panellari (o‘ng tomonda) -->
<g opacity=".9">
<rect x="1300" y="0" width="58" height="790" fill="url(#slat)"/>
<rect x="1366" y="0" width="58" height="790" fill="url(#slat)"/>
<rect x="1432" y="0" width="58" height="790" fill="url(#slat)"/>
<rect x="1498" y="0" width="58" height="790" fill="url(#slat)"/>
<rect x="1564" y="0" width="58" height="790" fill="url(#slat)"/>
</g>
<!-- oltin LED chiziq -->
<rect x="1268" y="60" width="4" height="700" fill="url(#led)" filter="url(#glow)"/>
<rect x="1269" y="60" width="2" height="700" fill="url(#led)"/>
<!-- yorug‘lik konusi -->
<rect width="1600" height="900" fill="url(#spot)"/>
<!-- pol -->
<rect y="790" width="1600" height="110" fill="url(#floor)"/>
<rect y="782" width="1600" height="10" fill="#2e2b28"/>
<rect x="780" y="792" width="600" height="90" fill="url(#refl)"/>
<ellipse cx="1080" cy="796" rx="230" ry="16" fill="#000" opacity=".55" filter="url(#soft)"/>
<!-- eshik (noir-gold.svg asosida, 1.25x) -->
<g transform="translate(780 115) scale(1.25)">
<rect x="132" y="56" width="228" height="486" fill="#000" opacity=".35" filter="url(#soft)"/>
<rect x="128" y="50" width="224" height="490" rx="2" fill="url(#casing)"/>
<rect x="146" y="66" width="188" height="474" fill="#000" opacity=".35"/>
<rect x="150" y="70" width="180" height="470" fill="url(#leaf)"/>
<rect x="176" y="100" width="128" height="410" fill="none" stroke="#c9a66b" stroke-width="2"/>
<line x1="176" y1="255.8" x2="304" y2="255.8" stroke="#c9a66b" stroke-width="2"/>
<rect x="192" y="116" width="96" height="123.8" fill="none" stroke="#c9a66b" stroke-width="1" opacity=".6"/>
<line x1="240" y1="255.8" x2="240" y2="510" stroke="#c9a66b" stroke-width="1" opacity=".6"/>
<rect x="150" y="70" width="180" height="470" fill="url(#sheen)"/>
<rect x="150.5" y="70.5" width="179" height="469" fill="none" stroke="#fff" stroke-opacity=".16"/>
<rect x="147" y="120" width="5" height="30" rx="2" fill="url(#metal)"/>
<rect x="147" y="450" width="5" height="30" rx="2" fill="url(#metal)"/>
<rect x="308" y="265" width="6" height="120" rx="3" fill="url(#metal)"/>
</g>
<!-- chap tomondagi matn uchun qo‘shimcha soya -->
<rect width="700" height="900" fill="#000" opacity=".18"/>
</svg>
