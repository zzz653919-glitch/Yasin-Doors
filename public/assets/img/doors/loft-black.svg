<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600">
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#9c9085"/><stop offset="1" stop-color="#807468"/>
</linearGradient>
<radialGradient id="light" cx="0.62" cy="0.18" r="0.75">
<stop offset="0" stop-color="#fff" stop-opacity="0.45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</radialGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#544438"/><stop offset="1" stop-color="#382c23"/>
</linearGradient>
<linearGradient id="leaf" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#212122"/><stop offset="0.45" stop-color="#303032"/><stop offset="1" stop-color="#1f1f21"/>
</linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#fff" stop-opacity="0.16"/><stop offset="0.5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.10"/>
</linearGradient>
<linearGradient id="casing" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#1e1e20"/><stop offset="0.5" stop-color="#313133"/><stop offset="1" stop-color="#1c1c1e"/>
</linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#dfe7ea" stop-opacity="0.95"/><stop offset="1" stop-color="#c4cbce" stop-opacity="0.95"/>
</linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#8a8a8a"/><stop offset="0.5" stop-color="#2b2b2b"/><stop offset="1" stop-color="#1c1c1c"/>
</linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
<filter id="blur2"><feGaussianBlur stdDeviation="1.2"/></filter>
</defs>
<rect width="480" height="600" fill="url(#wall)"/>
<rect width="480" height="600" fill="url(#light)"/>
<!-- floor -->
<rect y="540" width="480" height="60" fill="url(#floor)"/>
<rect y="526" width="480" height="16" fill="#a79d93"/>
<rect y="540" width="480" height="2" fill="#000" opacity="0.12"/>
<!-- shadow -->
<ellipse cx="240" cy="548" rx="150" ry="10" fill="#000" opacity="0.28" filter="url(#soft)"/>
<rect x="126" y="56" width="228" height="486" fill="#000" opacity="0.22" filter="url(#soft)" transform="translate(6 6)"/>
<!-- casing -->
<rect x="128" y="50" width="224" height="490" rx="2" fill="url(#casing)"/>
<rect x="128" y="50" width="224" height="490" fill="none" stroke="#000" stroke-opacity="0.12"/>
<rect x="146" y="66" width="188" height="474" fill="#000" opacity="0.35"/>
<!-- leaf -->
<rect x="150" y="70" width="180" height="470" fill="url(#leaf)"/>
<g>
<rect x="164" y="84" width="152" height="442" rx="1" fill="#111"/>
<rect x="168" y="88" width="144" height="434" rx="0" fill="url(#glass)"/>
<path d="M168 413.5 L283.2 88 H304.79999999999995 L168 500.29999999999995Z" fill="#fff" opacity="0.35"/>
<rect x="168" y="88" width="144" height="434" fill="none" stroke="#000" stroke-opacity="0.18"/>
</g><rect x="236" y="88" width="8" height="434" fill="#232325"/><rect x="168" y="192.5" width="144" height="8" fill="#232325"/><rect x="168" y="301" width="144" height="8" fill="#232325"/><rect x="168" y="409.5" width="144" height="8" fill="#232325"/>
<rect x="150" y="70" width="180" height="470" fill="url(#sheen)"/>
<rect x="150.5" y="70.5" width="179" height="469" fill="none" stroke="#fff" stroke-opacity="0.18"/>
<!-- hinges -->
<rect x="147" y="120" width="5" height="30" rx="2" fill="url(#metal)"/>
<rect x="147" y="450" width="5" height="30" rx="2" fill="url(#metal)"/>
<rect x="308" y="265" width="6" height="120" rx="3" fill="url(#metal)"/>
<rect x="312" y="265" width="2" height="120" fill="#000" opacity="0.25" transform="translate(3 3)" filter="url(#blur2)"/>
</svg>