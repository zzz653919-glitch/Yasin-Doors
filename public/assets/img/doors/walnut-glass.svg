<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600">
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#ded7cb"/><stop offset="1" stop-color="#c3bcb0"/>
</linearGradient>
<radialGradient id="light" cx="0.62" cy="0.18" r="0.75">
<stop offset="0" stop-color="#fff" stop-opacity="0.45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</radialGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#725c4a"/><stop offset="1" stop-color="#503e30"/>
</linearGradient>
<linearGradient id="leaf" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#66452f"/><stop offset="0.45" stop-color="#77553e"/><stop offset="1" stop-color="#61412c"/>
</linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#fff" stop-opacity="0.16"/><stop offset="0.5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.10"/>
</linearGradient>
<linearGradient id="casing" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#6a4730"/><stop offset="0.5" stop-color="#7a5842"/><stop offset="1" stop-color="#63432d"/>
</linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#eef3f4" stop-opacity="0.95"/><stop offset="1" stop-color="#d1d6d7" stop-opacity="0.95"/>
</linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#e1cca6"/><stop offset="0.5" stop-color="#c9a25e"/><stop offset="1" stop-color="#83693d"/>
</linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
<filter id="blur2"><feGaussianBlur stdDeviation="1.2"/></filter>
<filter id="grain" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.012 0.42" numOctaves="3" seed="11"/>
<feColorMatrix type="matrix" values="0 0 0 0 0.16470588235294117  0 0 0 0 0.09019607843137255  0 0 0 0 0.047058823529411764  0 0 0 0.6 0"/>
<feComposite in2="SourceGraphic" operator="in"/>
</filter>
</defs>
<rect width="480" height="600" fill="url(#wall)"/>
<rect width="480" height="600" fill="url(#light)"/>
<!-- floor -->
<rect y="540" width="480" height="60" fill="url(#floor)"/>
<rect y="526" width="480" height="16" fill="#e1dbd1"/>
<rect y="540" width="480" height="2" fill="#000" opacity="0.12"/>
<!-- shadow -->
<ellipse cx="240" cy="548" rx="150" ry="10" fill="#000" opacity="0.28" filter="url(#soft)"/>
<rect x="126" y="56" width="228" height="486" fill="#000" opacity="0.22" filter="url(#soft)" transform="translate(6 6)"/>
<!-- casing -->
<rect x="128" y="50" width="224" height="490" rx="2" fill="url(#casing)"/>
<rect x="128" y="50" width="224" height="490" fill="url(#casing)" filter="url(#grain)"/>
<rect x="128" y="50" width="224" height="490" fill="none" stroke="#000" stroke-opacity="0.12"/>
<rect x="146" y="66" width="188" height="474" fill="#000" opacity="0.35"/>
<!-- leaf -->
<rect x="150" y="70" width="180" height="470" fill="url(#leaf)"/>
<rect x="150" y="70" width="180" height="470" fill="url(#leaf)" filter="url(#grain)"/>
<g>
<rect x="206" y="106" width="68" height="398" rx="1" fill="#483021"/>
<rect x="210" y="110" width="60" height="390" rx="0" fill="url(#glass)"/>
<path d="M210 402.5 L258 110 H267 L210 480.5Z" fill="#fff" opacity="0.22"/>
<rect x="210" y="110" width="60" height="390" fill="none" stroke="#000" stroke-opacity="0.18"/>
</g>
<rect x="150" y="70" width="180" height="470" fill="url(#sheen)"/>
<rect x="150.5" y="70.5" width="179" height="469" fill="none" stroke="#fff" stroke-opacity="0.18"/>
<!-- hinges -->
<rect x="147" y="120" width="5" height="30" rx="2" fill="url(#metal)"/>
<rect x="147" y="450" width="5" height="30" rx="2" fill="url(#metal)"/>
<g>
<rect x="302" y="303" width="14" height="58" rx="7" fill="url(#metal)"/>
<rect x="270" y="319" width="44" height="11" rx="5.5" fill="#000" opacity="0.22" transform="translate(2 5)" filter="url(#blur2)"/>
<rect x="270" y="319" width="44" height="11" rx="5.5" fill="url(#metal)"/>
<circle cx="309" cy="349" r="3" fill="#65512f"/>
</g>
</svg>