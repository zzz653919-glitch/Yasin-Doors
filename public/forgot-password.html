<!doctype html>
<html lang="ru" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Восстановление пароля — YasinDoors</title>
  <meta name="description" content="Восстановление пароля аккаунта YasinDoors.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f7f5f1">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/palettes.css">
  <link rel="stylesheet" href="/assets/css/account.css">
  <link rel="stylesheet" href="/assets/css/mobile.css" media="(max-width: 960px)">
  <link rel="stylesheet" href="/assets/css/loader.css">
  <script src="/assets/js/theme-init.js"></script>
  <script src="/assets/js/loader.js"></script>
</head>
<body data-page="forgot">
  <div data-include="header"></div>

  <main>
    <section class="auth-page">
      <div class="container">
        <div class="auth-wrap">
          <div class="card auth-card">
            <div class="auth-head">
              <span class="eyebrow">Восстановление доступа</span>
              <h1>Забыли пароль?</h1>
              <p>Укажите email аккаунта — мы отправим ссылку для создания нового пароля.</p>
            </div>
            <form class="auth-form" data-auth-form="forgot" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" maxlength="254" placeholder="name@example.com" required>
        </div>
        <div class="form-alert" aria-live="polite"></div>
        <button class="btn btn--gold btn--block" type="submit">Отправить ссылку</button>
        <p class="auth-switch"><a href="/Login">Вернуться ко входу</a></p>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div data-include="footer"></div>

  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/products.js"></script>
  <script src="/assets/js/app.js"></script>
  <script src="/assets/js/palette.js"></script>
  <script src="/assets/js/account.js"></script>
  <script src="/assets/js/scroll.js"></script>
  <script src="/assets/js/form-utils.js"></script>
  <script src="/assets/js/auth-ui.js"></script>
  <script src="/assets/js/pages/auth.js"></script>
</body>
</html>
