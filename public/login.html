<body data-page="login">
  <div data-include="header"></div>

  <main>
    <section class="auth-page">
      <div class="container">
        <div class="auth-wrap">
          <div class="card auth-card">
            <div class="auth-head">
              <span class="eyebrow">Shaxsiy kabinet</span>
              <h1>Kirish</h1>
              <p>Buyurtmalaringiz va sevimli modellaringizni ko‘rish uchun kiring.</p>
            </div>
            <form class="auth-form" data-auth-form="login" novalidate>
        <div class="field">
          <label for="identifier">Email yoki telefon</label>
          <input class="input" id="identifier" name="identifier" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="254" placeholder="name@example.com yoki +998 90 123 45 67" required>
        </div>
        <div class="field">
          <label for="password">Parol</label>
          <div class="pw-wrap">
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" maxlength="128" placeholder="••••••••" required>
            <button class="pw-toggle" type="button" data-pw-toggle aria-pressed="false" aria-label="Parolni ko‘rsatish"><svg class="icon" aria-hidden="true"><use href="#i-eye"></use></svg><span>Parolni ko‘rsatish</span></button>
          </div>
        </div>
        <div class="auth-row">
          <label class="checkbox"><input type="checkbox" name="remember"> Meni eslab qol</label>
          <a href="/Forgot-Password">Parolni unutdingizmi?</a>
        </div>
        <div class="form-alert" aria-live="polite"></div>
        <button class="btn btn--gold btn--block" type="submit">Kirish</button>
        <p class="auth-switch">Hisobingiz yo‘qmi? <a href="/Register" data-keep-next>Ro‘yxatdan o‘tish</a></p>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div data-include="footer"></div>

  <script src="/assets/js/config.js"></script>

  <script src="/assets/js/auth-ui.js"></script>
  <script src="/assets/js/pages/auth.js"></script>
</body>
</html>
